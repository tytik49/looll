<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Мой Чат GPT</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .chatbox {
      background: #222;
      padding: 20px;
      border-radius: 10px;
      width: 500px;
      max-width: 90%;
    }
    #messages {
      height: 300px;
      overflow-y: auto;
      margin-bottom: 10px;
      padding: 10px;
      border: 1px solid #444;
      background: #000;
    }
    .msg {
      padding: 8px;
      margin: 5px 0;
      border-radius: 5px;
    }
    .user { background: #0055ff; text-align: right; }
    .bot { background: #333; text-align: left; }
    input {
      width: 75%;
      padding: 8px;
    }
    button {
      width: 20%;
      padding: 8px;
      margin-left: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="chatbox">
    <div id="messages"></div>
    <input id="query" type="text" placeholder="Задай вопрос...">
    <button onclick="search()">Отправить</button>
  </div>

<script>
async function search() {
  let query = document.getElementById("query").value;
  if (!query) return;

  // показываем вопрос
  let messages = document.getElementById("messages");
  messages.innerHTML += `<div class="msg user">${query}</div>`;
  document.getElementById("query").value = "";

  let apiKey = "AIzaSyBUpPHFROM1FOQhfS4WfGkphkGMUjr02ZY"; // твой ключ
  let cx = "d1cc8ed99be7448c6"; // твой cx из Google CSE
  let url = `https://www.googleapis.com/customsearch/v1?key=${apiKey}&cx=${cx}&q=${encodeURIComponent(query)}`;

  messages.innerHTML += `<div class="msg bot">Ищу ответ...</div>`;

  try {
    let res = await fetch(url);
    let data = await res.json();

    messages.lastChild.remove(); // убираем "Ищу ответ..."

    if (data.items && data.items.length > 0) {
      let answer = data.items[0].snippet;
      let link = data.items[0].link;
      messages.innerHTML += `<div class="msg bot">${answer}<br><a href="${link}" target="_blank">Подробнее</a></div>`;
    } else {
      messages.innerHTML += `<div class="msg bot">Ничего не найдено :(</div>`;
    }

    messages.scrollTop = messages.scrollHeight;
  } catch (err) {
    messages.innerHTML += `<div class="msg bot">Ошибка: ${err.message}</div>`;
  }
}
</script>
</body>
</html>
